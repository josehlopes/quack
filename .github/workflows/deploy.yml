name: "VPS Deploy"
on:
  push:
    branches:
      - prod
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
     - name: "Checkout Repository"
       uses: actions/checkout@v4

     - name: "Set up JDK 21"
       uses: actions/setup-java@v3
       with:
        java-version: '21'
        distribution: 'temurin'
          
     - name: "Build with Maven"
       run: mvn clean package -DskipTests

     - name: "Copy JAR to server"
       uses: appleboy/scp-action@master
       with:
         host: ${{ secrets.REMOTE_HOST }}
         username: ${{ secrets.REMOTE_USER }}
         key: ${{ secrets.SSH_PRIVATE_KEY }}
         port: ${{ secrets.REMOTE_PORT }}
         password: ${{ secrets.SSH_PASSWORD }}

         source: "target/quack-0.0.1-SNAPSHOT.jar"
         target: "/root/quack/"

     - name: "Run JAR on server"
       uses: appleboy/ssh-action@v0.1.8
       with:
         host: ${{ secrets.REMOTE_HOST }}
         username: ${{ secrets.REMOTE_USER }}
         key: ${{ secrets.SSH_PRIVATE_KEY }}
         port: ${{ secrets.REMOTE_PORT }}
         password: ${{ secrets.SSH_PASSWORD }}
         script: |
           nohup java -jar /root/quack/quack-0.0.1-SNAPSHOT.jar --no-dev --no-progress - a > /root/quack/quack.log 2>&1

     - name: "Run JAR using systemd on server"
       uses: appleboy/ssh-action@v0.1.8
       with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.REMOTE_PORT }}
        password: ${{ secrets.SSH_PASSWORD }}
        script: |
          sudo systemctl restart quack
